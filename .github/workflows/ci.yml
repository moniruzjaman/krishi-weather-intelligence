name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-test:
    name: Typecheck + Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # .npmrc in repo root sets allow-scripts=true so esbuild's postinstall
        # (needed by tsx) runs without warning.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # test script uses test/*.test.ts (not test/**/*.test.ts) because
        # GitHub Actions bash doesn't enable globstar by default.
        run: npm test

  build:
    name: Build (production tsc emit)
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Clean previous dist
        run: npm run clean

      - name: Build
        run: npm run build

      - name: Verify dist was emitted
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/api.js
          test -f dist/providers/open-meteo.js
          test -f dist/types/index.d.ts
